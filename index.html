<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic Rewards</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    :root {
      --bg: #090a0f;
      --surface: #11141e;
      --surface-elevated: #161a29;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 107, 0, 0.35);
      --accent: #ff6b00;
      --accent-gradient: linear-gradient(135deg, #ff8533 0%, #ff5500 100%);
      --accent-glow: rgba(255, 107, 0, 0.28);
      --text: #f1f5f9;
      --text-muted: #8b95a5;
      --success: #10b981;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 10% 0%, #1e130a 0%, var(--bg) 50%);
      color: var(--text);
      padding: 16px;
      min-height: 100vh;
      max-width: 480px;
      margin: 0 auto;
      user-select: none;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-top: 4px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }

    .user-avatar-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .wallet-trigger {
      display: flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: transform 0.15s ease;
    }

    .wallet-trigger:active {
      transform: scale(0.96);
    }

    .hero-banner {
      background: linear-gradient(180deg, rgba(255, 107, 0, 0.08) 0%, rgba(17, 20, 30, 0.6) 100%);
      border: 1px solid var(--border-focus);
      border-radius: var(--radius);
      padding: 18px 16px;
      text-align: center;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .hero-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
      color: #fff;
    }

    .hero-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .task-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 30px;
    }

    .mission-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: transform 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .mission-card.completed {
      opacity: 0.75;
      border-color: rgba(255, 255, 255, 0.04);
    }

    .mission-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .mission-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mission-number {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .mission-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .status-badge.active-step {
      background: rgba(255, 107, 0, 0.12);
      border-color: rgba(255, 107, 0, 0.3);
      color: var(--accent);
    }

    .status-badge.done {
      background: rgba(16, 185, 129, 0.12);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--success);
    }

    .btn-mission {
      width: 100%;
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 13px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: all 0.15s ease;
    }

    .btn-mission:active {
      transform: scale(0.98);
    }

    .btn-mission:disabled {
      background: #181c28 !important;
      color: #4b5568 !important;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: none !important;
      cursor: not-allowed;
      transform: none;
    }

    .track-wrapper {
      margin-top: 12px;
      background: #090a0f;
      height: 6px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .track-fill {
      background: var(--accent-gradient);
      height: 100%;
      width: 0%;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(4, 5, 8, 0.85);
      backdrop-filter: blur(10px);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-card {
      background: var(--surface-elevated);
      width: 100%;
      max-width: 390px;
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 18px 0;
    }

    .store-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d0f18;
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
    }

    .store-item:active {
      transform: scale(0.98);
      border-color: var(--accent);
      background: #141724;
    }

    .item-val {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .item-cost {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(255, 107, 0, 0.1);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 107, 0, 0.2);
    }

    .status-panel {
      padding: 14px;
      background: #090b12;
      border-radius: 12px;
      font-size: 13px;
      border: 1px dashed var(--border);
      text-align: center;
      margin-bottom: 16px;
    }

    .btn-dismiss {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="user-pill">
      <div class="user-avatar-dot"></div>
      <span id="user-display">Player</span>
    </div>
    <button class="wallet-trigger" onclick="showWallet()">
      <span>💎</span>
      <span id="diamond-counter">0</span>
    </button>
  </div>

  <div class="hero-banner">
    <div class="hero-title">Cosmic Daily Pass</div>
    <div class="hero-subtitle">Complete 5 missions daily • Verified Instant Payouts</div>
  </div>

  <div class="task-container" id="tasks-wrapper"></div>

  <!-- Wallet / Store Modal -->
  <div class="modal-overlay" id="wallet-popup">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:18px; color:#fff;">Redeem Store</h3>
        <span style="font-size:12px; color:var(--text-muted);">Instant Exchange</span>
      </div>
      <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">Exchange your diamonds for Google Play codes:</p>

      <div class="options-grid">
        <div class="store-item" onclick="submitRedeemRequest(1000, 10)">
          <span class="item-val">₹10 Redeem Code</span>
          <span class="item-cost">1,000 💎</span>
        </div>
        <div class="store-item" onclick="submitRedeemRequest(2000, 20)">
          <span class="item-val">₹20 Redeem Code</span>
          <span class="item-cost">2,000 💎</span>
        </div>
        <div class="store-item" onclick="submitRedeemRequest(3000, 30)">
          <span class="item-val">₹30 Redeem Code</span>
          <span class="item-cost">3,000 💎</span>
        </div>
        <div class="store-item" onclick="submitRedeemRequest(5000, 50)">
          <span class="item-val">₹50 Redeem Code</span>
          <span class="item-cost">5,000 💎</span>
        </div>
      </div>

      <div class="status-panel" id="request-display">No active redemption request</div>
      <button class="btn-dismiss" onclick="hideWallet()">Back to Missions</button>
    </div>
  </div>

<script>
  const TOTAL_BUTTONS = 5;
  const ADS_PER_BUTTON = 2; 
  const REWARD_PER_AD = 20;  

  // Dedicated Adsterra Mainstream Smartlink
  const ADSTERRA_LINK = "https://www.profitableratecpmnetwork.com/fhrujsyn?key=873ac4051875f59b08114297d528e2e8";

  const firebaseConfig = {
    apiKey: "AIzaSyDvC04b5_jmvpyxS-Yk2in0Uee3I8G5jd4",
    databaseURL: "https://amaibot-6736d-default-rtdb.firebaseio.com",
    projectId: "amaibot-6736d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const tgUser = tg?.initDataUnsafe?.user;
  const currentUserId = tgUser?.id ? String(tgUser.id) : "demo_user_test";
  const currentUserName = tgUser?.first_name || "Guest Player";
  document.getElementById("user-display").innerText = currentUserName;

  let totalDiamonds = 0;
  let buttonStates = new Array(TOTAL_BUTTONS).fill(0);

  function getTodayString() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  }

  buildButtons();

  // User Sync
  const userDatabaseRef = db.ref("users/" + currentUserId);
  userDatabaseRef.on("value", (snapshot) => {
    const data = snapshot.val();
    const today = getTodayString();

    if (data) {
      totalDiamonds = data.diamonds || 0;
      document.getElementById("diamond-counter").innerText = totalDiamonds.toLocaleString();

      if (data.lastDate !== today) {
        buttonStates = new Array(TOTAL_BUTTONS).fill(0);
        userDatabaseRef.update({
          tasks: buttonStates,
          lastDate: today
        });
      } else {
        const loadedTasks = data.tasks || [];
        buttonStates = Array.from({ length: TOTAL_BUTTONS }, (_, i) => loadedTasks[i] || 0);
      }
      buildButtons();
    } else {
      userDatabaseRef.set({
        name: currentUserName,
        diamonds: 0,
        tasks: new Array(TOTAL_BUTTONS).fill(0),
        lastDate: today
      });
    }
  });

  // Withdraw History
  const requestDatabaseRef = db.ref("withdrawals/" + currentUserId);
  requestDatabaseRef.on("value", (snapshot) => {
    const data = snapshot.val();
    const statusBox = document.getElementById("request-display");
    if (!data) {
      statusBox.innerHTML = `<span style="color:var(--text-muted);">No active pending requests</span>`;
    } else if (data.status === "pending") {
      statusBox.innerHTML = `
        <div style="color: var(--accent); font-weight:700; margin-bottom:2px;">⏳ Processing ₹${data.amount} Code</div>
        <div style="color:var(--text-muted); font-size:11px;">Verification takes up to 24 hours</div>
      `;
    } else if (data.status === "approved") {
      statusBox.innerHTML = `
        <div style="color: var(--success); font-weight:700; margin-bottom:6px;">🎉 Code Ready</div>
        <code style="display:inline-block; color:#fff; font-size:15px; font-weight:700; letter-spacing:1px; background:#0c0f18; padding:6px 12px; border-radius:6px; border:1px solid var(--border);">${data.code}</code>
      `;
    } else if (data.status === "rejected") {
      statusBox.innerHTML = `
        <div style="color: #ef4444; font-weight:700; margin-bottom:2px;">❌ Request Rejected</div>
        <div style="color:var(--text-muted); font-size:11px;">${data.reason || "Task verification failed."}</div>
      `;
    }
  });

  function buildButtons() {
    const wrapper = document.getElementById("tasks-wrapper");
    wrapper.innerHTML = "";

    for (let i = 0; i < TOTAL_BUTTONS; i++) {
      const watched = buttonStates[i] || 0;
      const left = ADS_PER_BUTTON - watched;
      const completed = left <= 0;
      const progressPercent = (watched / ADS_PER_BUTTON) * 100;

      wrapper.innerHTML += `
        <div class="mission-card ${completed ? 'completed' : ''}">
          <div class="mission-header">
            <div class="mission-meta">
              <span class="mission-number">#0${i + 1}</span>
              <span class="mission-title">Mission</span>
            </div>
            <span class="status-badge ${completed ? 'done' : 'active-step'}">
              ${completed ? "Completed" : left + " steps left"}
            </span>
          </div>

          <button class="btn-mission" id="btn-mission-${i}" ${completed ? "disabled" : ""} onclick="triggerAdsterraTask(${i})">
            ${completed ? "Claimed ✨" : `⚡ Complete Sponsor Step (+${REWARD_PER_AD} 💎)`}
          </button>

          <div class="track-wrapper">
            <div class="track-fill" style="width: ${progressPercent}%;"></div>
          </div>
        </div>
      `;
    }
  }

  // Trigger Adsterra Clean Direct Link
  function triggerAdsterraTask(index) {
    if (buttonStates[index] >= ADS_PER_BUTTON) return;

    const btn = document.getElementById(`btn-mission-${index}`);
    if (btn) btn.disabled = true;

    // Open link via Telegram native browser
    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) {
      window.Telegram.WebApp.openLink(ADSTERRA_LINK);
    } else {
      window.open(ADSTERRA_LINK, '_blank');
    }

    // Reward Credit
    setTimeout(() => {
      buttonStates[index] = (buttonStates[index] || 0) + 1;
      totalDiamonds += REWARD_PER_AD;

      document.getElementById("diamond-counter").innerText = totalDiamonds.toLocaleString();
      buildButtons();

      userDatabaseRef.update({
        name: currentUserName,
        diamonds: totalDiamonds,
        tasks: buttonStates,
        lastDate: getTodayString()
      });

      if (tg?.showAlert) {
        tg.showAlert(`🎉 +${REWARD_PER_AD} Diamonds credit ho gaye!`);
      } else {
        alert(`🎉 +${REWARD_PER_AD} Diamonds credit ho gaye!`);
      }
    }, 1200);
  }

  function showWallet() { document.getElementById("wallet-popup").style.display = "flex"; }
  function hideWallet() { document.getElementById("wallet-popup").style.display = "none"; }

  function submitRedeemRequest(requiredDiamonds, inrAmount) {
    if (totalDiamonds < requiredDiamonds) {
      alert("Aapke paas paryapt diamonds nahi hain!");
      return;
    }

    totalDiamonds -= requiredDiamonds;
    document.getElementById("diamond-counter").innerText = totalDiamonds.toLocaleString();

    userDatabaseRef.update({ diamonds: totalDiamonds });

    requestDatabaseRef.set({
      userId: currentUserId,
      userName: currentUserName,
      amount: inrAmount,
      diamondsUsed: requiredDiamonds,
      status: "pending",
      code: "",
      submittedAt: new Date().toLocaleString()
    });

    alert("Request submit ho gayi! Verification ke baad code update ho jayega.");
  }
</script>
</body>
</html>
