<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redeem Reward App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; user-select: none; }
    
    /* Top Bar */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .profile-card { background: #1e293b; padding: 8px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid #334155; }
    .diamond-badge { background: linear-gradient(135deg, #2563eb, #1d4ed8); border: none; padding: 8px 16px; border-radius: 20px; font-size: 15px; font-weight: bold; color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
    
    /* Task Cards */
    .task-container { display: flex; flex-direction: column; gap: 14px; }
    .ad-card { background: #1e293b; padding: 16px; border-radius: 14px; border: 1px solid #334155; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title { font-weight: 600; font-size: 15px; }
    .ad-badge { font-size: 12px; color: #38bdf8; background: #0f172a; padding: 4px 10px; border-radius: 8px; font-weight: bold; border: 1px solid #1e293b; }
    
    .action-btn { width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .action-btn:active { transform: scale(0.98); }
    .action-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; transform: none; }
    
    .progress-track { background: #0f172a; height: 8px; border-radius: 6px; margin-top: 12px; overflow: hidden; }
    .progress-bar { background: #38bdf8; height: 100%; width: 0%; transition: width 0.3s ease; }

    /* Wallet Popup */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); align-items: center; justify-content: center; padding: 16px; z-index: 100; }
    .modal-card { background: #1e293b; width: 100%; max-width: 380px; padding: 22px; border-radius: 16px; border: 1px solid #334155; }
    .option-item { background: #0f172a; padding: 14px; border-radius: 10px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #334155; transition: 0.2s; }
    .option-item:active { border-color: #38bdf8; }
    
    .status-panel { margin-top: 16px; padding: 14px; background: #0f172a; border-radius: 10px; font-size: 13px; text-align: center; border: 1px dashed #475569; }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="profile-card" id="user-display">👤 Player</div>
    <button class="diamond-badge" onclick="showWallet()">💎 <span id="diamond-counter">0</span></button>
  </div>

  <div class="task-container" id="tasks-wrapper"></div>

  <!-- Wallet Modal -->
  <div class="modal-overlay" id="wallet-popup">
    <div class="modal-card">
      <h3 style="font-size: 18px;">Redeem Code Store</h3>
      <p style="font-size: 12px; color: #94a3b8; margin: 6px 0 14px 0;">Diamonds exchange karke redeem code lein:</p>
      
      <div class="option-item" onclick="submitRedeemRequest(1200, 10)">
        <b>₹10 Code</b><span style="color:#38bdf8; font-weight:bold;">1,200 💎</span>
      </div>
      <div class="option-item" onclick="submitRedeemRequest(2300, 20)">
        <b>₹20 Code</b><span style="color:#38bdf8; font-weight:bold;">2,300 💎</span>
      </div>
      <div class="option-item" onclick="submitRedeemRequest(3000, 30)">
        <b>₹30 Code</b><span style="color:#38bdf8; font-weight:bold;">3,000 💎</span>
      </div>

      <div class="status-panel" id="request-display">Koi pending request nahi hai</div>
      <button class="action-btn" style="margin-top: 14px;" onclick="hideWallet()">Close</button>
    </div>
  </div>

<script>
  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyDvC04b5_jmvpyxS-Yk2in0Uee3I8G5jd4",
    databaseURL: "https://amaibot-6736d-default-rtdb.firebaseio.com",
    projectId: "amaibot-6736d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Telegram User Init
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // Telegram se ID / Name fetch (fallback for browser testing)
  const tgUser = tg?.initDataUnsafe?.user;
  const currentUserId = tgUser?.id ? String(tgUser.id) : "demo_user_test";
  const currentUserName = tgUser?.first_name || "Demo Player";
  document.getElementById("user-display").innerText = "👤 " + currentUserName;

  let totalDiamonds = 0;
  let buttonStates = [0, 0, 0, 0, 0];

  buildButtons();

  // Database Sync
  const userDatabaseRef = db.ref("users/" + currentUserId);
  userDatabaseRef.on("value", (snapshot) => {
    const data = snapshot.val();
    if (data) {
      totalDiamonds = data.diamonds || 0;
      buttonStates = data.tasks || [0, 0, 0, 0, 0];
      document.getElementById("diamond-counter").innerText = totalDiamonds;
      buildButtons();
    }
  });

  // Withdraw Status Listener
  const requestDatabaseRef = db.ref("withdrawals/" + currentUserId);
  requestDatabaseRef.on("value", (snapshot) => {
    const data = snapshot.val();
    const statusBox = document.getElementById("request-display");
    if (!data) {
      statusBox.innerText = "Koi pending request nahi hai";
    } else if (data.status === "pending") {
      statusBox.innerHTML = `⏳ <b>₹${data.amount} Request Pending:</b><br><span style="color:#94a3b8; font-size:12px;">Aapko 24 hours ke andar kabhi bhi code mil jayega.</span>`;
    } else if (data.status === "approved") {
      statusBox.innerHTML = `🎉 <b>Aapka Code Ready Hai:</b><br><code style="color:#38bdf8; font-size:16px; font-weight:bold; letter-spacing:1px;">${data.code}</code>`;
    }
  });

  function buildButtons() {
    const wrapper = document.getElementById("tasks-wrapper");
    wrapper.innerHTML = "";

    for (let i = 0; i < 5; i++) {
      const watched = buttonStates[i] || 0;
      const left = 5 - watched;
      const completed = left <= 0;
      const progressPercent = (watched / 5) * 100;

      wrapper.innerHTML += `
        <div class="ad-card">
          <div class="card-header">
            <span class="card-title">Button #${i + 1}</span>
            <span class="ad-badge">${completed ? "Completed" : left + " ads bache hain"}</span>
          </div>
          <button class="action-btn" id="task-btn-${i}" ${completed ? "disabled" : ""} onclick="handleWatchAd(${i})">
            ${completed ? "Mission Done" : "Watch Ad (+10 💎)"}
          </button>
          <div class="progress-track">
            <div class="progress-bar" style="width: ${progressPercent}%;"></div>
          </div>
        </div>
      `;
    }
  }

  function handleWatchAd(index) {
    const targetBtn = document.getElementById(`task-btn-${index}`);
    targetBtn.disabled = true;
    targetBtn.innerText = "Loading Ad...";

    // Ad Complete Simulator
    setTimeout(() => {
      buttonStates[index] = (buttonStates[index] || 0) + 1;
      totalDiamonds += 10;

      document.getElementById("diamond-counter").innerText = totalDiamonds;
      buildButtons();

      userDatabaseRef.set({
        name: currentUserName,
        diamonds: totalDiamonds,
        tasks: buttonStates
      });
    }, 1200);
  }

  function showWallet() { document.getElementById("wallet-popup").style.display = "flex"; }
  function hideWallet() { document.getElementById("wallet-popup").style.display = "none"; }

  function submitRedeemRequest(requiredDiamonds, inrAmount) {
    if (totalDiamonds < requiredDiamonds) {
      alert("Aapke paas paryapt diamonds nahi hain!");
      return;
    }

    totalDiamonds -= requiredDiamonds;
    document.getElementById("diamond-counter").innerText = totalDiamonds;

    userDatabaseRef.update({ diamonds: totalDiamonds });

    requestDatabaseRef.set({
      userId: currentUserId,
      userName: currentUserName,
      amount: inrAmount,
      diamondsUsed: requiredDiamonds,
      status: "pending",
      code: "",
      submittedAt: new Date().toLocaleString()
    });

    alert("Request submit ho gayi! 24 ghante ke andar code mil jayega.");
  }
</script>
</body>
</html>
